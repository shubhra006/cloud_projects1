<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>spool. — view a reel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14120F;
    --panel:#1C1814;
    --panel-raised:#241F19;
    --accent:#E8A33D;
    --accent-deep:#B5432D;
    --text:#F2EDE4;
    --text-muted:#948C7C;
    --border:#34302A;
    --font-display:'Fraunces', serif;
    --font-mono:'IBM Plex Mono', monospace;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    min-height:100%;
    background:
      radial-gradient(ellipse at 50% -10%, rgba(232,163,61,0.08), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:var(--font-mono);
    -webkit-font-smoothing:antialiased;
  }

  body{display:flex; flex-direction:column; min-height:100vh;}
  a{color:inherit;}
  ::selection{background:var(--accent); color:#14120F;}
  :focus-visible{outline:2px solid var(--accent); outline-offset:3px;}

  header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:28px 32px;
  }
  .wordmark{font-size:15px; text-decoration:none; color:var(--text);}
  .wordmark span{color:var(--accent);}
  nav a{
    font-size:13px; color:var(--text-muted); text-decoration:none;
    border-bottom:1px solid transparent; padding-bottom:2px;
    transition:color .2s ease, border-color .2s ease;
  }
  nav a:hover{color:var(--text); border-color:var(--border);}

  main{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:24px;
  }

  .lookup{
    width:100%;
    max-width:420px;
    margin-top:40px;
    text-align:center;
  }

  h1{
    font-family:var(--font-display);
    font-weight:500;
    font-size:26px;
    margin:0 0 8px;
  }
  .lede{
    color:var(--text-muted);
    font-size:13px;
    margin:0 0 26px;
  }

  .id-form{
    display:flex;
    gap:10px;
  }
  .id-form input{
    flex:1;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:3px;
    color:var(--text);
    font-family:var(--font-mono);
    font-size:15px;
    letter-spacing:0.06em;
    padding:12px 14px;
    text-align:center;
    text-transform:lowercase;
  }
  .id-form input::placeholder{color:var(--text-muted); letter-spacing:normal;}
  .id-form button{
    font-family:var(--font-mono);
    font-size:13px;
    font-weight:600;
    color:#1A1510;
    background:var(--accent);
    border:none;
    border-radius:3px;
    padding:0 20px;
    cursor:pointer;
    transition:background .2s ease, transform .15s ease;
  }
  .id-form button:hover:not(:disabled){background:#f0b158;}
  .id-form button:active:not(:disabled){transform:scale(0.98);}
  .id-form button:disabled{opacity:0.5; cursor:not-allowed;}

  .lookup-status{
    margin-top:16px;
    font-size:12.5px;
    color:var(--accent-deep);
    min-height:1.4em;
  }

  /* Gallery / contact sheet */
  .gallery-wrap{
    width:100%;
    max-width:920px;
    margin:36px auto 60px;
    display:none;
  }
  .gallery-wrap.show{display:block;}

  .sheet-meta{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    padding:0 4px 14px;
    font-size:12px;
    color:var(--text-muted);
  }
  .sheet-meta .id{color:var(--accent); font-weight:600;}

  .sprocket-row{
    display:flex;
    justify-content:space-between;
    padding:0 12px;
  }
  .sprocket-row span{
    width:9px; height:9px;
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:2px;
  }

  .contact-sheet{
    background:var(--panel);
    border:1px solid var(--border);
    padding:16px;
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(150px, 1fr));
    gap:12px;
  }

  .frame{
    position:relative;
    aspect-ratio:1;
    background:var(--panel-raised);
    border:1px solid var(--border);
    border-radius:2px;
    overflow:hidden;
    filter:blur(5px) brightness(0.55);
    opacity:0;
  }
  .frame.develop{
    animation:frame-develop 0.8s ease forwards;
    animation-delay:var(--d, 0s);
  }
  @keyframes frame-develop{
    0%{filter:blur(5px) brightness(0.55); opacity:0;}
    55%{filter:blur(1px) brightness(1.1); opacity:1;}
    100%{filter:blur(0) brightness(1); opacity:1;}
  }

  .frame img, .frame video{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }

  .frame .generic{
    width:100%; height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:10px;
    text-align:center;
  }
  .frame .generic .ext{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--text-muted);
    letter-spacing:0.05em;
  }

  .frame-overlay{
    position:absolute;
    inset:0;
    display:flex;
    align-items:flex-end;
    padding:8px;
    background:linear-gradient(to top, rgba(0,0,0,0.75), transparent 55%);
    opacity:0;
    transition:opacity .2s ease;
  }
  .frame:hover .frame-overlay,
  .frame:focus-within .frame-overlay{opacity:1;}

  .frame-overlay a{
    font-size:10.5px;
    color:var(--text);
    text-decoration:none;
    background:rgba(20,18,15,0.7);
    border:1px solid var(--border);
    border-radius:2px;
    padding:5px 8px;
    width:100%;
    text-align:center;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .frame-overlay a:hover{border-color:var(--accent); color:var(--accent);}

  .empty-state, .error-state{
    text-align:center;
    padding:40px 20px;
    color:var(--text-muted);
    font-size:13px;
  }
  .error-state strong{
    display:block;
    font-family:var(--font-display);
    font-size:18px;
    color:var(--text);
    font-weight:500;
    margin-bottom:8px;
  }

  footer{
    text-align:center;
    font-size:11px;
    color:var(--text-muted);
    padding:20px;
  }

  @media (max-width:480px){
    header{padding:20px;}
    .contact-sheet{grid-template-columns:repeat(auto-fill, minmax(120px, 1fr)); gap:8px; padding:10px;}
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }
</style>
</head>
<body>

<header>
  <a class="wordmark" href="index.html">spool<span>.</span></a>
  <nav><a href="index.html">send a reel</a></nav>
</header>

<main>
  <div class="lookup">
    <h1>Load a reel</h1>
    <p class="lede">Enter the reel number you were given to view what's inside.</p>
    <form class="id-form" id="idForm">
      <input type="text" id="idInput" placeholder="e.g. xk3f9aq2" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button type="submit" id="loadBtn">Load</button>
    </form>
    <p class="lookup-status" id="lookupStatus"></p>
  </div>

  <div class="gallery-wrap" id="galleryWrap">
    <div class="sheet-meta">
      <span>reel <span class="id" id="metaId"></span></span>
      <span id="metaCount"></span>
    </div>
    <div class="sprocket-row">
      <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="contact-sheet" id="contactSheet"></div>
  </div>
</main>

<footer>download links expire after one hour — reload the reel to refresh them</footer>

<script>
  // Point this at your FastAPI backend. Update after you deploy to EC2.
  const API_BASE = "http://127.0.0.1:8000";

  const idForm = document.getElementById("idForm");
  const idInput = document.getElementById("idInput");
  const loadBtn = document.getElementById("loadBtn");
  const lookupStatus = document.getElementById("lookupStatus");
  const galleryWrap = document.getElementById("galleryWrap");
  const contactSheet = document.getElementById("contactSheet");
  const metaId = document.getElementById("metaId");
  const metaCount = document.getElementById("metaCount");

  // Support ?id=xxxx in the URL (linked from the upload page)
  const params = new URLSearchParams(window.location.search);
  const presetId = params.get("id");
  if(presetId){
    idInput.value = presetId;
    loadShare(presetId);
  }

  idForm.addEventListener("submit", (e) => {
    e.preventDefault();
    const id = idInput.value.trim();
    if(id) loadShare(id);
  });

  function extOf(filename){
    const parts = filename.split(".");
    return parts.length > 1 ? parts.pop().toUpperCase() : "FILE";
  }

  function buildFrame(file, index){
    const frame = document.createElement("div");
    frame.className = "frame";
    frame.style.setProperty("--d", (index * 0.06) + "s");

    let mediaHtml;
    if(file.content_type && file.content_type.startsWith("image/")){
      mediaHtml = `<img src="${file.download_url}" alt="${file.filename}" loading="lazy">`;
    } else if(file.content_type && file.content_type.startsWith("video/")){
      mediaHtml = `<video src="${file.download_url}" muted preload="metadata"></video>`;
    } else {
      mediaHtml = `<div class="generic"><span class="ext">${extOf(file.filename)}</span></div>`;
    }

    frame.innerHTML = `
      ${mediaHtml}
      <div class="frame-overlay">
        <a href="${file.download_url}" download="${file.filename}" title="${file.filename}">${file.filename}</a>
      </div>
    `;
    return frame;
  }

  function loadShare(id){
    lookupStatus.textContent = "";
    galleryWrap.classList.remove("show");
    contactSheet.innerHTML = "";
    loadBtn.disabled = true;
    loadBtn.textContent = "Loading…";

    fetch(`${API_BASE}/share/${encodeURIComponent(id)}`)
      .then(res => {
        if(!res.ok) throw new Error(res.status === 404 ? "not-found" : "error");
        return res.json();
      })
      .then(data => {
        metaId.textContent = data.share_id;
        metaCount.textContent = data.files.length + (data.files.length === 1 ? " file" : " files");

        if(data.files.length === 0){
          contactSheet.innerHTML = `<div class="empty-state">This reel is empty.</div>`;
        } else {
          data.files.forEach((file, i) => {
            contactSheet.appendChild(buildFrame(file, i));
          });
        }

        galleryWrap.classList.add("show");
        requestAnimationFrame(() => {
          document.querySelectorAll(".frame").forEach(f => f.classList.add("develop"));
        });
      })
      .catch(err => {
        if(err.message === "not-found"){
          lookupStatus.textContent = "Reel not found — check the number and try again.";
        } else {
          lookupStatus.textContent = "Couldn't reach the server. Check the connection and try again.";
        }
      })
      .finally(() => {
        loadBtn.disabled = false;
        loadBtn.textContent = "Load";
      });
  }
</script>

</body>
</html>
